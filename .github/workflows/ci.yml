name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t s1-change-detection .
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 -e S1CD_DEFAULT_BACKEND=synthetic s1-change-detection
          up=0
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8000/health; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != "1" ]; then
            echo "::error::API did not become healthy within 90 s"
            docker ps -a; docker logs api; exit 1
          fi
          curl -sf -X POST "http://localhost:8000/change?wait=true" \
            -H "content-type: application/json" \
            -d @examples/request_synthetic.json -o result.json \
            || { echo "::error::POST /change failed"; docker logs api; exit 1; }
          python -c "import json; r=json.load(open('result.json')); assert r['status']=='completed', r; print('changed km2', r['changed_area_km2'])"
      - name: Container logs
        if: always()
        run: docker logs api 2>&1 | tail -50 || true
